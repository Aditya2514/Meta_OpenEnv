<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bar-emerald" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <!-- Top Title -->
  <text x="60" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="20">📊 Evaluation Benchmark Leaderboard &amp; Grader Analytics</text>
  <text x="60" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Performance metrics across 15 standard task environments (easy_1..5, medium_1..5, hard_1..5)</text>

  <!-- Key Metric Summary Cards -->
  <!-- Card 1 -->
  <g filter="url(#shadow4)">
    <rect x="60" y="105" width="255" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="80" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">EASY SCENARIOS SCORE</text>
    <text x="80" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">1.000 / 1.00</text>
    <text x="235" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100%</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow4)">
    <rect x="345" y="105" width="255" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="365" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MEDIUM SCENARIOS SCORE</text>
    <text x="365" y="165" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">0.900 / 1.00</text>
    <text x="520" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">90%</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow4)">
    <rect x="630" y="105" width="255" height="90" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="650" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">HARD SCENARIOS SCORE</text>
    <text x="650" y="165" fill="#c084fc" font-family="system-ui, sans-serif" font-size="24" font-weight="800">0.750 / 1.00</text>
    <text x="805" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">75%</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow4)">
    <rect x="915" y="105" width="225" height="90" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="935" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BURNOUT-FREE RATE</text>
    <text x="935" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="24" font-weight="800">96.4%</text>
  </g>

  <!-- Benchmark Comparison Bar Chart (Main Left Box) -->
  <g filter="url(#shadow4)">
    <rect x="60" y="215" width="680" height="385" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="85" y="245" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="14">🏆 Agent Benchmark Comparison Across Task Suites</text>

    <!-- Legend -->
    <rect x="420" y="235" width="12" height="12" rx="3" fill="url(#bar-emerald)"/>
    <text x="438" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Priority Heuristic Agent</text>

    <rect x="580" y="235" width="12" height="12" rx="3" fill="url(#bar-purple)"/>
    <text x="598" y="246" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Qwen 2.5 72B Instruct</text>

    <!-- Axes -->
    <line x1="110" y1="275" x2="110" y2="540" stroke="#334155" stroke-width="1"/>
    <line x1="110" y1="540" x2="710" y2="540" stroke="#334155" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="110" y1="275" x2="710" y2="275" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="278" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">1.0</text>

    <line x1="110" y1="341" x2="710" y2="341" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="344" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">0.75</text>

    <line x1="110" y1="407" x2="710" y2="407" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="410" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">0.50</text>

    <line x1="110" y1="473" x2="710" y2="473" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="100" y="476" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">0.25</text>

    <!-- Bar Group 1: Easy Suite -->
    <!-- Bar 1 (Heuristic) -->
    <rect x="160" y="275" width="45" height="265" rx="4" fill="url(#bar-emerald)"/>
    <text x="182" y="265" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1.00</text>
    <!-- Bar 2 (Qwen) -->
    <rect x="215" y="280" width="45" height="260" rx="4" fill="url(#bar-purple)"/>
    <text x="237" y="270" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0.98</text>
    <text x="210" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Easy Suite (easy_1..5)</text>

    <!-- Bar Group 2: Medium Suite -->
    <!-- Bar 1 (Heuristic) -->
    <rect x="360" y="301" width="45" height="239" rx="4" fill="url(#bar-emerald)"/>
    <text x="382" y="291" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0.90</text>
    <!-- Bar 2 (Qwen) -->
    <rect x="415" y="307" width="45" height="233" rx="4" fill="url(#bar-purple)"/>
    <text x="437" y="297" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0.88</text>
    <text x="410" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Medium Suite (medium_1..5)</text>

    <!-- Bar Group 3: Hard Suite -->
    <!-- Bar 1 (Heuristic) -->
    <rect x="560" y="341" width="45" height="199" rx="4" fill="url(#bar-emerald)"/>
    <text x="582" y="331" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0.75</text>
    <!-- Bar 2 (Qwen) -->
    <rect x="615" y="346" width="45" height="194" rx="4" fill="url(#bar-purple)"/>
    <text x="637" y="336" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0.73</text>
    <text x="610" y="565" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Hard Suite (hard_1..5)</text>
  </g>

  <!-- Right Panel: Grader Weights & Criteria -->
  <g filter="url(#shadow4)">
    <rect x="760" y="215" width="380" height="385" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="785" y="245" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="14">🎯 Grader Evaluation Metrics</text>

    <!-- Metric Item 1 -->
    <rect x="785" y="265" width="330" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="800" y="288" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">High-Severity Bug Completion (α)</text>
    <text x="800" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Weight: 0.55 – 0.70 | Must finish before deadline</text>

    <!-- Metric Item 2 -->
    <rect x="785" y="340" width="330" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="800" y="363" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Feature Completion Rate (β)</text>
    <text x="800" y="385" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Weight: 0.15 – 0.30 | Non-bug task backlog</text>

    <!-- Metric Item 3 -->
    <rect x="785" y="415" width="330" height="65" rx="8" fill="#1e293b" stroke="#ef4444" stroke-dasharray="3,3" stroke-width="1"/>
    <text x="800" y="438" fill="#fca5a5" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Overwork / Burnout Penalty (γ)</text>
    <text x="800" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Penalty ratio for days exceeding 8.0h limit</text>

    <!-- Metric Item 4 -->
    <rect x="785" y="490" width="330" height="95" rx="8" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1"/>
    <text x="800" y="513" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">⭐ Bonus Qualifications</text>
    <text x="800" y="535" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• +0.10 for Balanced Work (bugs + features)</text>
    <text x="800" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• +0.15 for Burnout-Free Episode Execution</text>
  </g>
</svg>
