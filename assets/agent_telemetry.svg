    <text x="115" y="410" fill="#f8fafc" font-family="monospace" font-size="12">{ </text><text x="130" y="410" fill="#38bdf8" font-family="monospace" font-size="12">"id"</text><text x="160" y="410" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="175" y="410" fill="#f59e0b" font-family="monospace" font-size="12">0</text><text x="185" y="410" fill="#f8fafc" font-family="monospace" font-size="12">, </text><text x="200" y="410" fill="#38bdf8" font-family="monospace" font-size="12">"status"</text><text x="270" y="410" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="285" y="410" fill="#34d399" font-family="monospace" font-size="12">"done"</text><text x="335" y="410" fill="#f8fafc" font-family="monospace" font-size="12"> },</text>
    <text x="115" y="435" fill="#f8fafc" font-family="monospace" font-size="12">{ </text><text x="130" y="435" fill="#38bdf8" font-family="monospace" font-size="12">"id"</text><text x="160" y="435" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="175" y="435" fill="#f59e0b" font-family="monospace" font-size="12">1</text><text x="185" y="435" fill="#f8fafc" font-family="monospace" font-size="12">, </text><text x="200" y="435" fill="#38bdf8" font-family="monospace" font-size="12">"status"</text><text x="270" y="435" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="285" y="435" fill="#fbbf24" font-family="monospace" font-size="12">"in_progress"</text><text x="405" y="435" fill="#f8fafc" font-family="monospace" font-size="12"> },</text>
    <text x="115" y="460" fill="#f8fafc" font-family="monospace" font-size="12">{ </text><text x="130" y="460" fill="#38bdf8" font-family="monospace" font-size="12">"id"</text><text x="160" y="460" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="175" y="460" fill="#f59e0b" font-family="monospace" font-size="12">2</text><text x="185" y="460" fill="#f8fafc" font-family="monospace" font-size="12">, </text><text x="200" y="460" fill="#38bdf8" font-family="monospace" font-size="12">"status"</text><text x="270" y="460" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="285" y="460" fill="#94a3b8" font-family="monospace" font-size="12">"not_started"</text><text x="415" y="460" fill="#f8fafc" font-family="monospace" font-size="12"> }</text>
    <text x="95" y="485" fill="#f8fafc" font-family="monospace" font-size="12">]</text>
    <text x="75" y="510" fill="#94a3b8" font-family="monospace" font-size="12">}</text>

    <text x="75" y="555" fill="#64748b" font-family="monospace" font-size="11">● Validated with Pydantic v2 Observation Model</text>
