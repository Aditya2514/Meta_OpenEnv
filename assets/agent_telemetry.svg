    <text x="115" y="285" fill="#38bdf8" font-family="monospace" font-size="12">"tasks_remaining"</text><text x="265" y="285" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="280" y="285" fill="#f59e0b" font-family="monospace" font-size="12">3</text><text x="290" y="285" fill="#f8fafc" font-family="monospace" font-size="12">,</text>
    <text x="115" y="310" fill="#38bdf8" font-family="monospace" font-size="12">"high_severity_bugs_remaining"</text><text x="365" y="310" fill="#f8fafc" font-family="monospace" font-size="12">: </text><text x="380" y="310" fill="#ef4444" font-family="monospace" font-size="12">1</text><text x="390" y="310" fill="#f8fafc" font-family="monospace" font-size="12">,</text>
