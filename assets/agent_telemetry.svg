    <text x="1115" y="468" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" font-weight="700">8h MAX</text>

    <!-- Bars -->
    <!-- Day 0 -->
    <rect x="730" y="485" width="45" height="70" rx="4" fill="#3b82f6"/>
    <text x="752" y="480" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">6.0h</text>
    <text x="752" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Day 0</text>

    <!-- Day 1 -->
    <rect x="830" y="495" width="45" height="60" rx="4" fill="#3b82f6"/>
    <text x="852" y="490" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">5.5h</text>
    <text x="852" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Day 1</text>

    <!-- Day 2 -->
    <rect x="930" y="485" width="45" height="70" rx="4" fill="#3b82f6"/>
    <text x="952" y="480" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">6.0h</text>
    <text x="952" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Day 2</text>

    <!-- Day 3 -->
    <rect x="1030" y="515" width="45" height="40" rx="4" fill="#10b981"/>
    <text x="1052" y="510" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3.5h</text>
    <text x="1052" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Day 3</text>
