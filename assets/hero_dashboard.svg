    <line x1="40" y1="70" x2="1160" y2="70" stroke="#334155" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="65" cy="50" r="6" fill="#ef4444"/>
    <circle cx="85" cy="50" r="6" fill="#f59e0b"/>
