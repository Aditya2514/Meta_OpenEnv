    <text x="890" y="392" fill="#10b981" font-family="monospace" font-size="11">reward : +82.6214</text>
    <text x="890" y="412" fill="#38bdf8" font-family="monospace" font-size="11">done   : false</text>
    <text x="890" y="432" fill="#c084fc" font-family="monospace" font-size="11">mentor : "Assisted (+0.2)"</text>

