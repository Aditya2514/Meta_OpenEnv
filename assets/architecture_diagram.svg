<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="600" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="22" text-anchor="middle">Meta OpenEnv Architecture &amp; Client-Server Lifecycle</text>
  <text x="600" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">OpenEnv Spec v0.1.0 • Gym HTTP Interface • Deterministic Episode Graders</text>

  <!-- Component 1: Client / Agent Policy (Left) -->
  <g filter="url(#shadow3)">
    <rect x="60" y="140" width="280" height="430" rx="12" fill="#090d16" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="60" y="140" width="280" height="45" rx="12" fill="#1e293b"/>
    <text x="200" y="168" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">🧠 Agent Policy / LLM</text>

    <!-- Content -->
    <rect x="80" y="205" width="240" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="230" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Qwen 2.5 72B Instruct</text>
    <text x="95" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">via HuggingFace Router</text>

    <rect x="80" y="285" width="240" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="95" y="310" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="13">Heuristic / RL Agent</text>
    <text x="95" y="332" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Priority &amp; Mentor Heuristic</text>

    <rect x="80" y="365" width="240" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="95" y="390" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">INFERENCE LOOP</text>
    <text x="95" y="415" fill="#94a3b8" font-family="monospace" font-size="11">1. GET /state or POST /reset</text>
    <text x="95" y="440" fill="#94a3b8" font-family="monospace" font-size="11">2. Parse Observation</text>
    <text x="95" y="465" fill="#94a3b8" font-family="monospace" font-size="11">3. Predict Action JSON</text>
    <text x="95" y="490" fill="#94a3b8" font-family="monospace" font-size="11">4. POST /step</text>
    <text x="95" y="515" fill="#38bdf8" font-family="monospace" font-size="11">5. Accumulate Reward</text>
  </g>

  <!-- Arrows Client <-> Server -->
  <!-- Forward Arrow (POST /step Action) -->
  <path d="M 340 240 L 460 240" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="355" y="215" width="90" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="229" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Action JSON</text>

  <!-- Backward Arrow (Step Response) -->
  <path d="M 460 320 L 340 320" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="350" y="328" width="100" height="20" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="400" y="342" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Obs, Reward, Done</text>

  <!-- Component 2: OpenEnv Server Container (Middle) -->
  <g filter="url(#shadow3)">
    <rect x="460" y="140" width="340" height="430" rx="12" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="460" y="140" width="340" height="45" rx="12" fill="#1e293b"/>
    <text x="630" y="168" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">🌐 OpenEnv FastAPI Server (Docker)</text>

    <!-- Endpoints Box -->
    <rect x="480" y="205" width="300" height="145" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="495" y="228" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">FASTAPI HTTP ENDPOINTS</text>

    <rect x="495" y="242" width="55" height="18" rx="3" fill="#3b82f6"/>
    <text x="522" y="255" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">POST</text>
    <text x="560" y="255" fill="#f8fafc" font-family="monospace" font-size="11">/reset?task_id=hard_1</text>

    <rect x="495" y="272" width="55" height="18" rx="3" fill="#3b82f6"/>
    <text x="522" y="285" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">POST</text>
    <text x="560" y="285" fill="#f8fafc" font-family="monospace" font-size="11">/step (Action payload)</text>

    <rect x="495" y="302" width="55" height="18" rx="3" fill="#10b981"/>
    <text x="522" y="315" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">GET</text>
    <text x="560" y="315" fill="#f8fafc" font-family="monospace" font-size="11">/state (Full inspection)</text>

    <!-- Core Env Engine Box -->
    <rect x="480" y="365" width="300" height="180" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="495" y="390" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AssignmentPlannerEnv</text>
    <text x="495" y="415" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Task Catalog: 15 Configurations</text>
    <text x="495" y="438" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Daily Working Hours: 6.0h / day</text>
    <text x="495" y="461" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Dense Reward Calculation</text>
    <text x="495" y="484" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Burnout Tracking &amp; Penalties</text>
    <text x="495" y="507" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Mentor Assistance Mechanics</text>
  </g>

  <!-- Arrows Server <-> Graders -->
  <path d="M 800 280 L 890 280" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="815" y="255" width="60" height="20" rx="4" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
  <text x="845" y="269" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Trajectory</text>

  <!-- Component 3: Graders & Evaluators (Right) -->
  <g filter="url(#shadow3)">
    <rect x="890" y="140" width="250" height="430" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <rect x="890" y="140" width="250" height="45" rx="12" fill="#1e293b"/>
    <text x="1015" y="168" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="15" text-anchor="middle">⚖️ Grader Engine</text>

    <!-- Grader Functions -->
    <rect x="910" y="205" width="210" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="925" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="12">grade_easy()</text>
    <text x="925" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">α=0.70 Bug | β=0.30 Feature</text>

    <rect x="910" y="290" width="210" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="925" y="315" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="12">grade_medium()</text>
    <text x="925" y="337" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">α=0.55 Bug | γ=0.20 Overload</text>

    <rect x="910" y="375" width="210" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="925" y="400" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12">grade_hard()</text>
    <text x="925" y="422" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">α=0.60 Bug | γ=0.30 Overload</text>

    <!-- Final Score Display -->
    <rect x="910" y="460" width="210" height="85" rx="8" fill="url(#box-grad1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="1015" y="485" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">JUDGE SCORE RANGE</text>
    <text x="1015" y="520" fill="#34d399" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle">0.00 – 1.00</text>
  </g>
</svg>
